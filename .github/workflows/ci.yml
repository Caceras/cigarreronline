name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Check every page was prerendered
        run: |
          test -f dist/index.html
          test -f dist/cigarrer/kubanska/index.html
          test -f dist/sitemap.xml
          echo "pages: $(find dist -name index.html | wc -l)"
