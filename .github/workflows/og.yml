name: Share image
# Renders scripts/og.html to public/og.png and commits it. Runs when the template changes, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/og.html, scripts/og.mjs]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright && npx playwright install --with-deps chromium
      - run: node scripts/og.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og.png
          git diff --cached --quiet || (git commit -m "Render share image" && git push)
