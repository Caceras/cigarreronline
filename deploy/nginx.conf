# One Cache-Control per kind of file. Set at server level so the security headers below are
# never dropped (nginx forgets server-level add_header inside any location that has its own).
map $uri $cache_control {
    ~^/assets/                        "public, max-age=31536000, immutable";
    ~^/img/                           "public, max-age=604800";
    ~^/icons/                         "public, max-age=604800";
    /og.png                           "public, max-age=86400";
    /sw.js                            "no-cache, no-store, must-revalidate";
    /manifest.json                    "no-cache";
    ~^/(sitemap\.xml|robots\.txt)$    "public, max-age=3600";
    default                           "no-cache";
}

# www → apex, permanently, keeping the path.
server {
    listen 80;
    server_name www.cigarreronline.se;
    absolute_redirect off;
    return 301 https://cigarreronline.se$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header Cache-Control $cache_control always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Every page is prerendered to <path>/index.html. /x redirects to /x/ (one URL per page),
    # and unknown paths return a real 404.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
